server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: gazellio-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gazellio}
    username: ${DB_USER:gazellio}
    password: ${DB_PASSWORD:gazellio}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt-secret: ${JWT_SECRET:replace-this-secret-in-production-with-at-least-32-bytes}
  jwt-hours: ${JWT_HOURS:12}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cisa-kev-url: ${CISA_KEV_URL:https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
  nvd-api-key: ${NVD_API_KEY:}
  agent-registration-token: ${AGENT_REGISTRATION_TOKEN:local-agent-registration-token}
  cisa-kev-sync-cron: ${CISA_KEV_SYNC_CRON:0 15 3 * * *}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
