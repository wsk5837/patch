server:
  address: 0.0.0.0
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: gazellio-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gazellio}
    username: ${DB_USER:gazellio}
    password: ${DB_PASSWORD:gazellio}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt-secret: ${JWT_SECRET:replace-this-secret-in-production-with-at-least-32-bytes}
  mfa-encryption-key: ${MFA_ENCRYPTION_KEY:${JWT_SECRET:replace-this-secret-in-production-with-at-least-32-bytes}}
  jwt-hours: ${JWT_HOURS:12}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  scheduler:
    # Render briefly overlaps old and new instances during rolling deploys.
    initial-delay-ms: ${SCHEDULER_INITIAL_DELAY_MS:60000}
  cisa-kev-url: ${CISA_KEV_URL:https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
  cisa-kev-fallback-url: ${CISA_KEV_FALLBACK_URL:https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json}
  cisa-kev-sync-on-startup: ${CISA_KEV_SYNC_ON_STARTUP:false}
  nvd-api-key: ${NVD_API_KEY:}
  agent-registration-token: ${AGENT_REGISTRATION_TOKEN:local-agent-registration-token}
  cisa-kev-sync-cron: ${CISA_KEV_SYNC_CRON:0 15 3 * * *}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  cmdb:
    enabled: ${CMDB_ENABLED:false}
    base-url: ${CMDB_BASE_URL:https://zypoc.gazellio.com/backend-server}
    client-id: ${CMDB_CLIENT_ID:}
    client-secret: ${CMDB_CLIENT_SECRET:}
    page-size: ${CMDB_PAGE_SIZE:100}
    sync-on-startup: ${CMDB_SYNC_ON_STARTUP:true}
    sync-cron: ${CMDB_SYNC_CRON:0 0/30 * * * *}
    replace-local-assets: ${CMDB_REPLACE_LOCAL_ASSETS:true}
    class-keys: ${CMDB_CLASS_KEYS:virtual_host,physics_machine,mysql,oracle,redis,postgresql,mongodb,elasticsearch,tomcat,nginx,firewall,swtich,router,load_balance,nas,k8s_pod,idcrack,idc,logic_subsystem,physical_subsystem,deployment_unit,business,application,service,KingBase}
