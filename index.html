 if(step===3)body=`<div class="wizard-intro"><h4>${lang==='zh'?'扫描与凭证策略':'Scan and credential policy'}</h4><p>${lang==='zh'?'优先使用本机 Agent 进行有凭证检查；无 Agent 资产将回退到 SSH / WinRM。':'Use authenticated agent checks first; fall back to SSH / WinRM where needed.'}</p></div><div class="form-grid three"><div class="field"><label>${t('credential')}</label><select id="credentialMode"><option value="agent" ${scanDraft.credential==='agent'?'selected':''}>Agent + Local Privilege</option><option value="vault">Vault credential set</option><option value="network">Network only</option></select></div><div class="field"><label>${lang==='zh'?'端口范围':'Port range'}</label><input id="scanPorts" value="${scanDraft.ports}"></div><div class="field"><label>${lang==='zh'?'扫描强度':'Intensity'}</label><select id="scanIntensity"><option value="safe">Safe</option><option value="balanced" ${scanDraft.intensity==='balanced'?'selected':''}>Balanced</option><option value="deep">Deep</option></select></div></div><div class="form-section"><div class="form-section-title"><span>${lang==='zh'?'安全控制':'Safety controls'}</span><span class="tag ok">${lang==='zh'?'已启用':'Enabled'}</span></div><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'禁止执行可能导致服务中断的探测插件':'Disable potentially disruptive plugins'}</label><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'应用探针异常时自动暂停当前业务系统':'Pause the service group if health probes fail'}</label><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'保留完整取证与扫描审计日志':'Retain evidence and audit logs'}</label></div>`;
 if(step===4)body=`<div class="wizard-intro"><h4>${lang==='zh'?'确认并开始扫描':'Review and start'}</h4><p>${lang==='zh'?'扫描启动后可以离开此页面，任务将在后台继续。':'The task continues in the background after you leave this page.'}</p></div><div class="review-grid"><div class="review-item"><span>${lang==='zh'?'任务':'Task'}</span><b>${scanDraft.name}</b></div><div class="review-item"><span>${lang==='zh'?'模板':'Template'}</span><b>${scanDraft.template}</b></div><div class="review-item"><span>${lang==='zh'?'范围':'Scope'}</span><b>${scanDraft.scope.toUpperCase()} · ${scanDraft.assetCount} ${t('devices')}</b></div><div class="review-item"><span>${lang==='zh'?'凭证 / 强度':'Credential / intensity'}</span><b>${scanDraft.credential} · ${scanDraft.intensity}</b></div></div><div class="callout" style="margin-top:14px">${lang==='zh'?'系统预计使用 3 个扫描节点，约 12–18 分钟完成。任务开始时会执行 Agent 在线率、凭证可用性和维护窗口检查。':'Estimated duration: 12–18 minutes across three scanner nodes. Agent health, credentials and maintenance windows are validated first.'}</div>`;
 showModal(`${`<div class="modal-head"><div><h3>${t('newScanTitle')}</h3><div class="card-meta">${lang==='zh'?'有凭证漏洞扫描':'Authenticated vulnerability assessment'}</div></div><button class="close-x" onclick="closeModal()">×</button></div>`}${wizardHeader(step,labels)}<div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('cancel')}</button><span class="spacer"></span>${step>1?`<button class="btn" onclick="scanWizardBack(${step})">${lang==='zh'?'上一步':'Back'}</button>`:''}<button class="btn primary" onclick="${step<4?`scanWizardNext(${step})`:'launchScan()'}">${step<4?(lang==='zh'?'下一步':'Next'):(lang==='zh'?'立即开始扫描':'Start scan now')}</button></div>`)
}
function launchScan(){
 const id='SCAN-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+String(Math.floor(Math.random()*900)+100);
 const task={id,name:scanDraft.name,nameEn:scanDraft.name,scope:scanDraft.scope.toUpperCase(),template:scanDraft.template,status:'running',progress:1,assets:scanDraft.assetCount,scanned:0,findings:0,created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
 appState.scans.unshift(task);audit(lang==='zh'?'启动漏洞扫描':'Scan started',`${id} · ${task.assets} assets`);closeModal();go('scan');startScanRuntime(id);showToast(lang==='zh'?'扫描已启动，正在进行前置检查':'Scan started; running pre-checks')
}
function startScanRuntime(id){
 if(runtime.scans[id])return;runtime.scans[id]=setInterval(()=>{const s=appState.scans.find(x=>x.id===id);if(!s||s.status!=='running'){clearInterval(runtime.scans[id]);delete runtime.scans[id];return}s.progress=Math.min(100,s.progress+Math.floor(Math.random()*9)+5);s.scanned=Math.min(s.assets,Math.round(s.assets*s.progress/100));s.findings=Math.max(s.findings,Math.round(s.progress/14));if(s.progress>=100){s.status='completed';s.scanned=s.assets;s.completed=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});audit(lang==='zh'?'扫描完成':'Scan completed',`${s.id} · ${s.findings} findings`);clearInterval(runtime.scans[id]);delete runtime.scans[id];showToast(lang==='zh'?`${s.id} 扫描完成，发现 ${s.findings} 项风险`:`${s.id} completed with ${s.findings} findings`)}saveAppState();if(currentPage==='scan')render()},850)
}
function showScanResult(id){const s=appState.scans.find(x=>x.id===id);if(!s)return;showModal(`<div class="modal-head"><div><h3>${s.id} · ${lang==='zh'?'扫描结果':'Scan result'}</h3><div class="card-meta">${s.name}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="summary-strip"><div class="summary-cell"><div class="n">${s.assets}</div><div class="l">${lang==='zh'?'目标资产':'Targets'}</div></div><div class="summary-cell"><div class="n">${s.scanned}</div><div class="l">${lang==='zh'?'已扫描':'Scanned'}</div></div><div class="summary-cell"><div class="n">${s.findings}</div><div class="l">${lang==='zh'?'风险发现':'Findings'}</div></div><div class="summary-cell"><div class="n">${s.progress}%</div><div class="l">${t('coverage')}</div></div><div class="summary-cell"><div class="n">${s.status==='completed'?'Pass':'Live'}</div><div class="l">${t('status')}</div></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>CVE</th><th>${t('severity')}</th><th>${t('asset')}</th><th>${t('patchAvail')}</th></tr></thead><tbody>${vulnerabilities.slice(0,Math.min(4,s.findings||1)).map(v=>`<tr><td class="link">${v.cve}</td><td>${severityTag(v.sev)}</td><td class="mono">${v.asset}</td><td>${v.patch}</td></tr>`).join('')}</tbody></table></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('close')}</button><button class="btn primary" onclick="closeModal();go('vuln')">${lang==='zh'?'进入漏洞中心':'Open Vulnerability Center'}</button></div>`)}
function stopScan(id){const s=appState.scans.find(x=>x.id===id);if(s&&s.status==='running'){s.status='stopped';audit(lang==='zh'?'停止扫描':'Scan stopped',id);saveAppState();render();showToast(lang==='zh'?'扫描已安全停止':'Scan stopped safely')}}
function deployAgentModal(){showModal(`<div class="modal-head"><div><h3>${t('deployAgent')}</h3><div class="card-meta">${lang==='zh'?'选择部署方式并生成安装配置':'Choose a deployment method and generate configuration'}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="choice-grid"><div class="choice selected"><b>Linux Agent</b><small>RPM / DEB · systemd · x86_64 / ARM64</small></div><div class="choice"><b>Windows Agent</b><small>MSI · GPO / SCCM · Server 2016+</small></div><div class="choice"><b>Container Sensor</b><small>Kubernetes DaemonSet · read-only</small></div></div><div class="form-section"><div class="form-section-title"><span>${lang==='zh'?'注册配置':'Enrollment settings'}</span><span class="tag purple">CN-SH-PROD-01</span></div><div class="form-grid"><div class="field"><label>${lang==='zh'?'所属环境':'Environment'}</label><select><option>${t('prod')}</option><option>${t('test')}</option></select></div><div class="field"><label>${lang==='zh'?'扫描节点':'Scanner node'}</label><select><option>CN-SH-PROD-01 · 12 ms</option><option>Auto select</option></select></div><div class="field full"><label>${lang==='zh'?'一次性注册令牌':'One-time enrollment token'}</label><input readonly value="gzl_enroll_7H2K-••••-9P3M"></div></div></div><div class="callout warning" style="margin-top:12px">${lang==='zh'?'安装包使用一次性令牌注册，24 小时后失效。Agent 默认仅收集漏洞、软件包和补丁状态，不读取业务数据。':'Enrollment tokens expire after 24 hours. Agents collect vulnerability, package and patch state only.'}</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="simulateDeployAgent()">${lang==='zh'?'生成安装包':'Generate package'}</button></div>`)}
function simulateDeployAgent(){closeModal();audit(lang==='zh'?'生成 Agent 安装包':'Agent package generated','Linux · CN-SH-PROD-01');showToast(lang==='zh'?'安装包与部署脚本已生成':'Package and deployment script generated')}
function scanPage(){
 const running=appState.scans.find(s=>s.status==='running');const rows=appState.scans.map(s=>`<tr><td><div class="link" onclick="showScanResult('${s.id}')">${s.id}</div><div class="muted" style="font-size:10px;margin-top:3px">${lang==='zh'?s.name:(s.nameEn||s.name)}</div></td><td>${s.scope}</td><td>${s.template}</td><td><div class="status-with-progress"><span class="tag ${s.status==='completed'?'ok':s.status==='running'?'purple':s.status==='stopped'?'red':'gray'}">${s.status==='completed'?t('finished'):s.status==='running'?t('running'):(lang==='zh'?'已停止':'Stopped')}</span>${s.status==='running'?`<div class="progress"><span style="width:${s.progress}%"></span></div>`:''}</div></td><td>${s.scanned} / ${s.assets}</td><td><b>${s.findings}</b></td><td><div class="table-actions"><button class="action-link" onclick="showScanResult('${s.id}')">${t('detail')}</button>${s.status==='running'?`<button class="action-link" style="color:#C23B49" onclick="stopScan('${s.id}')">${lang==='zh'?'停止':'Stop'}</button>`:''}</div></td></tr>`).join('');
 return `${pageHeader('scan','scanSub',`<button class="btn" onclick="deployAgentModal()">${t('deployAgent')}</button><button class="btn primary" onclick="newScanModal()">${icon('scan')}${lang==='zh'?'开始漏洞扫描':'Start Scan'}</button>`)}${running?`<div class="live-banner"><div class="live-orb">${icon('scan')}</div><div class="live-copy"><b>${running.name}</b><span>${running.id} · ${running.scanned}/${running.assets} ${lang==='zh'?'资产已完成':'assets completed'} · ${running.findings} ${lang==='zh'?'项发现':'findings'}</span></div><div class="live-progress"><div class="progress"><span style="width:${running.progress}%"></span></div><small>${running.progress}%</small></div><button class="btn" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)" onclick="showScanResult('${running.id}')">${t('detail')}</button></div>`:''}<div class="grid cols-3"><div class="card padded"><div class="metric-label">${t('scanAgents')}</div><div class="metric-value">2,418</div><div class="metric-foot"><span class="delta good">97.8% ${t('coverage')}</span></div></div><div class="card padded"><div class="metric-label">${t('scannerNodes')}</div><div class="metric-value">8 / 8</div><div class="metric-foot"><span class="delta good">${t('online')}</span></div></div><div class="card padded"><div class="metric-label">${lang==='zh'?'今日扫描资产':'Assets scanned today'}</div><div class="metric-value">${appState.scans.reduce((a,s)=>a+s.scanned,0).toLocaleString()}</div><div class="metric-foot"><span>${appState.scans.reduce((a,s)=>a+s.findings,0)} ${lang==='zh'?'项风险发现':'findings'}</span></div></div></div><div class="section-head"><h3>${t('scanTasks')}</h3><small>${lang==='zh'?'任务进度、发现和审计实时更新':'Progress, findings and audit update in real time'}</small></div><div class="card table-wrap"><table class="table"><thead><tr><th>${lang==='zh'?'任务':'Task'}</th><th>${t('targetScope')}</th><th>${t('scanTemplate')}</th><th>${t('status')}</th><th>${t('coverage')}</th><th>${lang==='zh'?'发现':'Findings'}</th><th>${t('action')}</th></tr></thead><tbody>${rows}</tbody></table></div>`
}

/* ---------- Patch jobs ---------- */
let patchDraft={};
function patchModal(patchId){patchDraft={patch:patchId||patches[0].id,environment:'test',ring:'Ring 0 · Canary 5%',window:'Now',rollback:true,change:true};patchWizard(1)}
function collectPatch(step){if(step===1)patchDraft.patch=safeVal('patchChoice',patchDraft.patch);if(step===2){patchDraft.environment=safeVal('patchEnv',patchDraft.environment);patchDraft.ring=safeVal('patchRing',patchDraft.ring)}if(step===3){patchDraft.window=safeVal('patchWindow',patchDraft.window)}}
function patchWizardNext(step){collectPatch(step);patchWizard(step+1)}function patchWizardBack(step){collectPatch(step);patchWizard(step-1)}
function patchWizard(step){const labels=lang==='zh'?['选择补丁','目标与批次','安全控制','确认任务']:['Patch','Targets','Controls','Review'];let body='';const p=patches.find(x=>x.id===patchDraft.patch)||patches[0];
 if(step===1)body=`<div class="wizard-intro"><h4>${lang==='zh'?'选择经过校验的补丁':'Select a verified patch'}</h4><p>${lang==='zh'?'补丁必须完成签名验证、适用性分析和测试状态检查后才能进入部署。':'Signature, applicability and test status are checked before deployment.'}</p></div><div class="field"><label>${t('patchSelect')}</label><select id="patchChoice">${patches.map(x=>`<option value="${x.id}" ${x.id===patchDraft.patch?'selected':''}>${x.id} · ${x.vendor} · ${x.assets} assets</option>`).join('')}</select></div><div class="card padded" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><div><b>${p.id}</b><div class="card-meta" style="margin-top:4px">${p.cves} · ${p.size}</div></div><span class="tag ${p.test==='passed'?'ok':'warn'}">${p.test==='passed'?t('passed'):t('pending')}</span></div><div class="divider"></div><div class="kv"><div class="k">SHA-256</div><div class="v mono">8f4d…c23a</div><div class="k">${t('source')}</div><div class="v">${p.source}</div><div class="k">${t('affects')}</div><div class="v">${p.assets} ${t('devices')}</div></div></div>`;
 if(step===2)body=`<div class="wizard-intro"><h4>${lang==='zh'?'选择环境和灰度批次':'Choose environment and rollout ring'}</h4><p>${lang==='zh'?'生产环境必须先完成测试验证，并按 Ring 0/1/2 逐步放量。':'Production requires successful testing and progressive Ring 0/1/2 rollout.'}</p></div><div class="form-grid"><div class="field"><label>${t('targetEnv')}</label><select id="patchEnv"><option value="test" ${patchDraft.environment==='test'?'selected':''}>${t('test')}</option><option value="prod" ${patchDraft.environment==='prod'?'selected':''}>${t('prod')}</option></select></div><div class="field"><label>${t('wave')}</label><select id="patchRing"><option>Ring 0 · Canary 5%</option><option>Ring 1 · Limited 20%</option><option>Ring 2 · Broad 75%</option></select></div></div><div class="form-section"><div class="form-section-title"><span>${lang==='zh'?'目标资产预览':'Target preview'}</span><span class="tag purple">${p.assets} ${t('devices')}</span></div><div class="audit-line"><b>Windows Server 2022</b> · 31 assets · 96% online</div><div class="audit-line"><b>Windows Server 2019</b> · 17 assets · 100% online</div></div>`;
 if(step===3)body=`<div class="wizard-intro"><h4>${lang==='zh'?'维护窗口与回滚':'Window and rollback controls'}</h4><p>${lang==='zh'?'安装前创建快照并验证应用探针；任何一个门禁失败都会暂停当前批次。':'Create snapshots and validate probes before installation. Any failed gate pauses the ring.'}</p></div><div class="form-grid"><div class="field"><label>${t('window')}</label><select id="patchWindow"><option>Now</option><option>Saturday 00:00 – 04:00</option><option>Next approved change window</option></select></div><div class="field"><label>${lang==='zh'?'失败阈值':'Failure threshold'}</label><select><option>Stop ring at 5%</option><option>Stop ring at 10%</option></select></div></div><div class="form-section"><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'安装前创建系统快照 / 包管理器回滚点':'Create snapshot or package rollback point'}</label><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'补丁后执行应用健康检查和关键交易探针':'Run application health and transaction probes'}</label><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'补丁后自动发起漏洞复测':'Automatically launch post-patch rescan'}</label><label class="check-row"><input type="checkbox" checked>${lang==='zh'?'生产环境自动生成变更草稿':'Create production change draft automatically'}</label></div>`;
 if(step===4)body=`<div class="wizard-intro"><h4>${lang==='zh'?'确认部署任务':'Review deployment'}</h4><p>${lang==='zh'?'测试环境会立即执行；生产环境会先进入变更审批。':'Test runs immediately; production waits for change approval.'}</p></div><div class="review-grid"><div class="review-item"><span>${t('patchId')}</span><b>${patchDraft.patch}</b></div><div class="review-item"><span>${t('targetEnv')}</span><b>${t(patchDraft.environment)}</b></div><div class="review-item"><span>${t('wave')}</span><b>${patchDraft.ring}</b></div><div class="review-item"><span>${t('window')}</span><b>${patchDraft.window}</b></div></div><div class="callout ${patchDraft.environment==='prod'?'warning':''}" style="margin-top:14px">${patchDraft.environment==='prod'?(lang==='zh'?'生产任务创建后会自动生成变更草稿，并在审批通过前保持锁定。':'A change draft will be created and the job remains locked until approval.'):(lang==='zh'?'任务创建后将依次执行预检、快照、安装、验证和漏洞复测。':'Pre-check, snapshot, installation, validation and rescan will run in sequence.')}</div>`;
 showModal(`<div class="modal-head"><div><h3>${t('patchDeployTitle')}</h3><div class="card-meta">${lang==='zh'?'安全灰度发布':'Risk-controlled rollout'}</div></div><button class="close-x" onclick="closeModal()">×</button></div>${wizardHeader(step,labels)}<div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('cancel')}</button><span class="spacer"></span>${step>1?`<button class="btn" onclick="patchWizardBack(${step})">${lang==='zh'?'上一步':'Back'}</button>`:''}<button class="btn primary" onclick="${step<4?`patchWizardNext(${step})`:'launchPatchJob()'}">${step<4?(lang==='zh'?'下一步':'Next'):(lang==='zh'?'创建并执行':'Create job')}</button></div>`)
}
function launchPatchJob(){const id='PCH-'+String(Date.now()).slice(-6);const waiting=patchDraft.environment==='prod';const job={id,patch:patchDraft.patch,env:patchDraft.environment,ring:patchDraft.ring,status:waiting?'approval':'running',progress:waiting?0:3,stage:waiting?(lang==='zh'?'等待变更审批':'Awaiting approval'):(lang==='zh'?'执行前检查':'Pre-check'),created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};appState.patchJobs.unshift(job);if(waiting){const cid='CHG-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+String(Math.floor(Math.random()*900)+100);appState.changes.unshift({id:cid,title:`${patchDraft.patch} 生产补丁发布`,titleEn:`${patchDraft.patch} Production Patch`,window:'Next approved window',approver:'CAB',risk:'Medium',status:'draft',job:id})}audit(lang==='zh'?'创建补丁任务':'Patch job created',`${id} · ${patchDraft.patch}`);saveAppState();closeModal();go('patch');if(!waiting)startPatchRuntime(id);showToast(waiting?(lang==='zh'?'补丁任务已创建，等待变更审批':'Patch job created; awaiting change approval'):(lang==='zh'?'补丁任务已开始执行':'Patch job started'))}
function startPatchRuntime(id){if(runtime.patches[id])return;runtime.patches[id]=setInterval(()=>{const j=appState.patchJobs.find(x=>x.id===id);if(!j||j.status!=='running'){clearInterval(runtime.patches[id]);delete runtime.patches[id];return}j.progress=Math.min(100,j.progress+8);j.stage=j.progress<20?(lang==='zh'?'前置检查':'Pre-check'):j.progress<35?(lang==='zh'?'创建快照':'Snapshot'):j.progress<75?(lang==='zh'?'安装补丁':'Installing'):j.progress<92?(lang==='zh'?'应用验证':'Validation'):(lang==='zh'?'漏洞复测':'Rescan');if(j.progress>=100){j.status='completed';j.stage=lang==='zh'?'完成':'Completed';audit(lang==='zh'?'补丁任务完成':'Patch job completed',j.id);clearInterval(runtime.patches[id]);delete runtime.patches[id];showToast(lang==='zh'?`${j.id} 已完成并通过复测`:`${j.id} completed and verified`)}saveAppState();if(currentPage==='patch')render()},900)}
function syncPatchCatalog(){appState.patchSync=new Date().toLocaleString();audit(lang==='zh'?'同步补丁库':'Patch catalog synced','Microsoft · Red Hat · Ubuntu · Oracle');saveAppState();showToast(lang==='zh'?'补丁目录已更新，签名校验通过':'Patch catalog updated and signatures verified');render()}
function showPatchJob(id){const j=appState.patchJobs.find(x=>x.id===id);if(!j)return;showModal(`<div class="modal-head"><div><h3>${j.id} · ${j.patch}</h3><div class="card-meta">${t(j.env)} · ${j.ring}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="live-banner"><div class="live-orb">${icon('patch')}</div><div class="live-copy"><b>${j.stage}</b><span>${j.status} · ${j.progress}%</span></div><div class="live-progress"><div class="progress"><span style="width:${j.progress}%"></span></div></div></div><div class="timeline"><div class="timeline-item"><div class="t">${t('precheck')}</div><div class="d">Agent · disk · dependency · snapshot</div></div><div class="timeline-item"><div class="t">${t('install')}</div><div class="d">${j.patch} · ${j.ring}</div></div><div class="timeline-item"><div class="t">${t('verify')}</div><div class="d">HTTP · process · transaction probes</div></div><div class="timeline-item"><div class="t">${t('rescan')}</div><div class="d">Agent authenticated verification</div></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`)}
function patchPage(){const jobRows=appState.patchJobs.length?appState.patchJobs.map(j=>`<tr><td class="link" onclick="showPatchJob('${j.id}')">${j.id}</td><td>${j.patch}</td><td>${t(j.env)}</td><td>${j.ring}</td><td><span class="tag ${j.status==='completed'?'ok':j.status==='running'?'purple':'warn'}">${j.stage}</span>${j.status==='running'?`<div class="progress" style="margin-top:7px"><span style="width:${j.progress}%"></span></div>`:''}</td><td>${j.created}</td><td><button class="action-link" onclick="showPatchJob('${j.id}')">${t('detail')}</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">${icon('patch')}</div><h3>${lang==='zh'?'暂无自定义补丁任务':'No custom patch jobs yet'}</h3><p>${lang==='zh'?'从补丁库选择补丁并创建灰度部署任务':'Choose a verified patch and create a rollout job'}</p><button class="btn primary" onclick="patchModal()">${t('createPatch')}</button></div></td></tr>`;return `${pageHeader('patch','patchSub',`<button class="btn" onclick="syncPatchCatalog()">${t('syncPatch')}</button><button class="btn primary" onclick="patchModal()">${t('createPatch')}</button>`)}<div class="card"><div class="card-header"><div><div class="card-title">${t('patchServers')}</div><div class="card-meta" style="margin-top:3px">${lang==='zh'?'最近同步：':'Last sync: '}${appState.patchSync}</div></div><span class="tag ok">HA · Healthy</span></div><div class="patch-topology"><div class="topo-node"><div class="circle">SRC</div><h4>${lang==='zh'?'厂商补丁源':'Vendor sources'}</h4><p>Microsoft · Red Hat · Ubuntu · Oracle</p></div><div class="topo-arrow">→</div><div class="topo-node"><div class="circle">PS</div><h4>${lang==='zh'?'Gazellio 补丁服务器':'Gazellio Patch Server'}</h4><p>${lang==='zh'?'同步 · 签名校验 · 缓存':'Sync · signature · cache'}</p></div><div class="topo-arrow">→</div><div class="topo-node"><div class="circle">AG</div><h4>${lang==='zh'?'资产执行器':'Asset executors'}</h4><p>${lang==='zh'?'灰度 · 安装 · 回滚':'Ring · install · rollback'}</p></div></div></div><div class="section-head"><h3>${lang==='zh'?'部署任务':'Deployment Jobs'}</h3><small>${appState.patchJobs.length} jobs</small></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>${t('patchId')}</th><th>${t('env')}</th><th>${t('wave')}</th><th>${t('status')}</th><th>${lang==='zh'?'创建时间':'Created'}</th><th>${t('action')}</th></tr></thead><tbody>${jobRows}</tbody></table></div><div class="section-head"><h3>${t('patchLibrary')}</h3><small>${lang==='zh'?'签名与适用性已校验':'Signature and applicability verified'}</small></div><div class="card table-wrap"><table class="table"><thead><tr><th>${t('patchId')}</th><th>${t('vendor')}</th><th>CVE</th><th>${t('affects')}</th><th>${t('testResult')}</th><th>${t('size')}</th><th>${t('source')}</th><th>${t('action')}</th></tr></thead><tbody>${patches.map(p=>`<tr><td class="link">${p.id}</td><td>${p.vendor}</td><td class="mono">${p.cves}</td><td>${p.assets}</td><td><span class="tag ${p.test==='passed'?'ok':p.test==='failed'?'red':'warn'}">${p.test==='passed'?t('passed'):p.test==='failed'?t('failed'):t('pending')}</span></td><td>${p.size}</td><td>${p.source}</td><td><button class="action-link" onclick="patchModal('${p.id}')">${lang==='zh'?'部署':'Deploy'}</button></td></tr>`).join('')}</tbody></table></div>`}

/* ---------- Remediation tasks and changes ---------- */
function createTaskModal(vIndex){const v=Number.isInteger(vIndex)?vulnerabilities[vIndex]:vulnerabilities[0];showModal(`<div class="modal-head"><div><h3>${t('createTask')}</h3><div class="card-meta">${lang==='zh'?'从漏洞、资产和责任关系生成处置任务':'Create a remediation task from vulnerability and CMDB context'}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>${t('cve')}</label><select id="taskVuln">${vulnerabilities.map((x,i)=>`<option value="${i}" ${x===v?'selected':''}>${x.cve} · ${x.asset}</option>`).join('')}</select></div><div class="field"><label>${t('owner')}</label><select id="taskOwner"><option>${v.owner}</option><option>陈浩</option><option>刘洁</option><option>王锐</option></select></div><div class="field"><label>${lang==='zh'?'优先级':'Priority'}</label><select id="taskPriority"><option>P1</option><option>P2</option><option>P3</option></select></div><div class="field"><label>${t('sla')}</label><select id="taskDue"><option>24h</option><option>3d</option><option>7d</option></select></div><div class="field full"><label>${lang==='zh'?'处置说明':'Instructions'}</label><textarea id="taskNote">${lang==='zh'?'先在测试环境验证补丁与应用健康，再进入生产变更。':'Validate patch and application health in test before production change.'}</textarea></div></div><div class="callout" style="margin-top:14px">${lang==='zh'?`CMDB 已关联资产 ${v.asset}、业务系统 ${v.app} 与责任人 ${v.owner}。`:`CMDB mapped ${v.asset}, ${v.app} and owner ${v.owner}.`}</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="createRemediationTask()">${t('confirmCreate')}</button></div>`)}
function createRemediationTask(){const v=vulnerabilities[Number(safeVal('taskVuln','0'))]||vulnerabilities[0];const id='REM-'+String(Date.now()).slice(-6);appState.tasks.unshift({id,title:`${v.cve} · ${v.patch}`,owner:safeVal('taskOwner',v.owner),priority:safeVal('taskPriority','P1'),due:safeVal('taskDue','24h'),stage:'assigned',asset:v.asset,note:safeVal('taskNote')});audit(lang==='zh'?'创建处置任务':'Remediation task created',id);saveAppState();closeModal();go('task');showToast(lang==='zh'?'处置任务已创建并通知责任人':'Task created and owner notified')}
function advanceTask(id){const task=appState.tasks.find(x=>x.id===id);if(!task)return;const flow=['assigned','test','ready','done'];const i=flow.indexOf(task.stage);task.stage=flow[Math.min(flow.length-1,i+1)];audit(lang==='zh'?'推进处置任务':'Task advanced',`${id} → ${task.stage}`);saveAppState();render();showToast(lang==='zh'?'任务阶段已更新':'Task stage updated')}
function taskCardV3(x){const labels={assigned:lang==='zh'?'待处理':'Assigned',test:lang==='zh'?'测试验证':'Test',ready:lang==='zh'?'待生产':'Ready for Prod',done:lang==='zh'?'已关闭':'Closed'};return `<div class="task-card" onclick="showTask('${x.id}')"><div class="task-title">${x.title}</div><div class="task-meta"><span>${x.id} · ${x.asset}</span><span>${x.due}</span></div><div class="task-foot"><span class="tag ${x.priority==='P1'?'red':'warn'}">${x.priority}</span><span class="tag gray">${x.owner}</span></div>${x.stage!=='done'?`<div class="task-actions"><button onclick="event.stopPropagation();advanceTask('${x.id}')">${lang==='zh'?'推进到下一阶段':'Advance stage'}</button></div>`:''}</div>`}
function showTask(id){const x=appState.tasks.find(t=>t.id===id);showModal(`<div class="modal-head"><div><h3>${x.id}</h3><div class="card-meta">${x.title}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="review-grid"><div class="review-item"><span>${t('asset')}</span><b>${x.asset}</b></div><div class="review-item"><span>${t('owner')}</span><b>${x.owner}</b></div><div class="review-item"><span>${lang==='zh'?'优先级':'Priority'}</span><b>${x.priority}</b></div><div class="review-item"><span>${t('status')}</span><b>${x.stage}</b></div></div><div class="divider"></div><div class="timeline"><div class="timeline-item"><div class="t">${t('assignStep')}</div><div class="d">${x.owner} · SLA ${x.due}</div></div><div class="timeline-item"><div class="t">${t('testPatchStep')}</div><div class="d">${x.stage==='assigned'?(lang==='zh'?'等待执行':'Pending'):(lang==='zh'?'已进入测试':'In progress')}</div></div><div class="timeline-item"><div class="t">${t('changeStep')}</div><div class="d">${x.stage==='ready'||x.stage==='done'?(lang==='zh'?'已准备':'Ready'):(lang==='zh'?'等待测试完成':'Blocked by test')}</div></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('close')}</button>${x.stage!=='done'?`<button class="btn primary" onclick="closeModal();advanceTask('${x.id}')">${lang==='zh'?'推进任务':'Advance'}</button>`:''}</div>`)}
function taskPage(){const cols=[['assigned',t('assigned')],['test',t('inTest')],['ready',t('readyProd')],['done',t('closed')]];return `${pageHeader('task','taskSub',`<button class="btn" onclick="showToast('${lang==='zh'?'已按 CMDB 责任人完成建议分派':'Assignment suggestions generated'}')">${lang==='zh'?'智能分派':'Smart Assign'}</button><button class="btn primary" onclick="createTaskModal()">${t('createTask')}</button>`)}<div class="notice">${icon('task')}<div><b>${lang==='zh'?'任务会真实保存并可推进状态':'Tasks persist and can be advanced'}</b><p>${lang==='zh'?'演示数据保存在当前浏览器；推进任务会同步更新审计记录。':'Demo data persists in this browser; advancing tasks updates the audit log.'}</p></div></div><div class="kanban" style="grid-template-columns:repeat(4,minmax(220px,1fr))">${cols.map(([key,label])=>`<div class="kanban-col"><div class="kanban-head"><span>${label}</span><span class="kanban-count">${appState.tasks.filter(x=>x.stage===key).length}</span></div>${appState.tasks.filter(x=>x.stage===key).map(taskCardV3).join('')||`<div class="empty" style="padding:20px 8px">${lang==='zh'?'暂无任务':'No tasks'}</div>`}</div>`).join('')}</div>`}
function newChangeModal(jobId){showModal(`<div class="modal-head"><div><h3>${t('newChange')}</h3><div class="card-meta">${lang==='zh'?'生产补丁变更申请':'Production patch change request'}</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>${t('changeTitle')}</label><input id="changeTitle" value="${jobId||'Gazellio'} 生产补丁发布"></div><div class="field"><label>${t('window')}</label><input id="changeWindow" value="Saturday 00:00 – 04:00"></div><div class="field"><label>${t('approver')}</label><select id="changeApprover"><option>张磊 / CAB</option><option>刘杰 / CAB</option></select></div><div class="field"><label>${t('risk')}</label><select id="changeRisk"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="field"><label>${lang==='zh'?'关联任务':'Linked job'}</label><input id="changeJob" value="${jobId||''}" placeholder="PCH-xxxxxx"></div><div class="field full"><label>${lang==='zh'?'回退方案':'Rollback plan'}</label><textarea>Restore snapshot / package rollback; verify service probes; notify owner.</textarea></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="createChange()">${lang==='zh'?'提交审批':'Submit for approval'}</button></div>`)}
function createChange(){const id='CHG-'+String(Date.now()).slice(-6);appState.changes.unshift({id,title:safeVal('changeTitle'),titleEn:safeVal('changeTitle'),window:safeVal('changeWindow'),approver:safeVal('changeApprover'),risk:safeVal('changeRisk'),status:'draft',job:safeVal('changeJob')});audit(lang==='zh'?'提交变更':'Change submitted',id);saveAppState();closeModal();render();showToast(lang==='zh'?'变更已提交审批':'Change submitted for approval')}
function approveChange(id){const c=appState.changes.find(x=>x.id===id);c.status='scheduled';const job=appState.patchJobs.find(x=>x.id===c.job);if(job){job.status='running';job.progress=3;job.stage=lang==='zh'?'执行前检查':'Pre-check';startPatchRuntime(job.id)}audit(lang==='zh'?'批准变更':'Change approved',id);saveAppState();render();showToast(lang==='zh'?'变更已批准，补丁任务已解锁':'Change approved; patch job unlocked')}
function closeChange(id){const c=appState.changes.find(x=>x.id===id);c.status='closed';audit(lang==='zh'?'关闭变更':'Change closed',id);saveAppState();render();showToast(lang==='zh'?'变更证据已归档并关闭':'Change evidence archived and closed')}
function changePage(){return `${pageHeader('change','changeSub',`<button class="btn primary" onclick="newChangeModal()">${t('newChange')}</button>`)}<div class="summary-strip"><div class="summary-cell"><div class="n">${appState.changes.filter(x=>x.status==='draft').length}</div><div class="l">${t('awaiting')}</div></div><div class="summary-cell"><div class="n">${appState.changes.filter(x=>x.status==='scheduled').length}</div><div class="l">${t('scheduled')}</div></div><div class="summary-cell"><div class="n">${appState.changes.filter(x=>x.status==='implementing').length}</div><div class="l">${t('implementing')}</div></div><div class="summary-cell"><div class="n">${appState.changes.filter(x=>x.status==='closed').length}</div><div class="l">${t('closed')}</div></div><div class="summary-cell"><div class="n">96.8%</div><div class="l">${lang==='zh'?'按窗口完成率':'On-window completion'}</div></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>${t('changeNo')}</th><th>${t('changeTitle')}</th><th>${t('window')}</th><th>${t('approver')}</th><th>${t('risk')}</th><th>${t('implementation')}</th><th>${t('action')}</th></tr></thead><tbody>${appState.changes.map(c=>`<tr><td class="link">${c.id}</td><td>${lang==='zh'?c.title:(c.titleEn||c.title)}<div class="muted" style="font-size:10px;margin-top:3px">${c.job||'—'}</div></td><td>${c.window}</td><td>${c.approver}</td><td><span class="tag ${c.risk==='High'?'red':c.risk==='Medium'?'warn':'gray'}">${c.risk}</span></td><td><span class="tag ${c.status==='closed'?'ok':c.status==='implementing'?'purple':c.status==='scheduled'?'blue':'warn'}">${c.status==='draft'?t('awaiting'):c.status==='scheduled'?t('scheduled'):c.status==='implementing'?t('implementing'):t('closed')}</span></td><td><div class="table-actions">${c.status==='draft'?`<button class="action-link" onclick="approveChange('${c.id}')">${lang==='zh'?'批准':'Approve'}</button>`:''}${c.status==='implementing'||c.status==='scheduled'?`<button class="action-link" onclick="closeChange('${c.id}')">${lang==='zh'?'关闭':'Close'}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}

function orchestrationHtml(status,progress){const defs=[[dual('前置检查','Pre-check'),'Agent · disk · load'],[dual('获取补丁','Acquire Patch'),'Signature · checksum'],[dual('创建回滚点','Rollback Point'),'Snapshot · package state'],[dual('灰度安装','Ring Install'),'Ring 0 → 1 → 2'],[dual('应用验证','App Validation'),'HTTP · process · transaction'],[dual('漏洞复测','Vulnerability Rescan'),'Authenticated scan']];return '<div class="flow-canvas"><div class="flow-row">'+defs.map(function(x,i){const edge=(i+1)/defs.length*100;const cls=status==='failed'&&i===4?'fail':progress>=edge?'done':progress>i/defs.length*100?'running':'';return '<div class="flow-node '+cls+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'}).join('')+'</div></div>'}
function showAutomationJob(id){const j=appState.autoJobs.find(function(x){return x.id===id});if(!j)return;const code=j.language==='PowerShell'?'$patch = $env:GAZELLIO_PATCH\\nTest-PatchPrerequisite -Patch $patch\\nNew-RestorePoint -Description \"Gazellio pre-patch\"\\nInstall-WindowsUpdate -KBArticleID $patch -AcceptAll\\nInvoke-GazellioHealthProbe':'#!/bin/bash\\nset -euo pipefail\\ngazellio-agent precheck --policy strict\\ngazellio-patch install \"$PATCH_ID\" --ring \"$RING\"\\ngazellio-probe verify --service \"$SERVICE\"';showModal('<div class="modal-head"><div><h3>'+(lang==='zh'?j.name:j.nameEn)+'</h3><div class="card-meta">'+j.id+' · '+j.version+' · '+j.platform+'</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="subnav"><button class="active">'+dual('基本信息','Basic Info')+'</button><button>'+dual('编排信息','Orchestration')+'</button><button>'+dual('审批信息','Approval')+'</button></div><div class="review-grid"><div class="review-item"><span>'+dual('作业类型','Job Type')+'</span><b>'+(lang==='zh'?j.type:j.typeEn)+'</b></div><div class="review-item"><span>'+dual('超时时间','Timeout')+'</span><b>'+j.timeout+'s</b></div><div class="review-item"><span>'+dual('所属系统','System')+'</span><b>'+j.system+'</b></div><div class="review-item"><span>'+dual('创建与版本','Creator & Version')+'</span><b>'+j.creator+' · '+j.version+'</b></div></div><div class="form-section"><div class="form-section-title">'+dual('作业说明','Description')+'</div><div class="card-meta" style="line-height:1.65">'+j.description+'</div></div><div class="section-head"><h3>'+dual('编排流程','Orchestration Flow')+'</h3><small>'+dual('可钻取节点','Drillable nodes')+'</small></div>'+orchestrationHtml('completed',100)+'<div class="section-head"><h3>'+dual('作业内容','Job Content')+'</h3><small>'+j.language+'</small></div><div class="code-editor"><div class="code-toolbar"><span>'+j.language.toLowerCase()+'</span><span>read-only · '+j.version+'</span></div><pre>'+esc(code)+'</pre></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">'+t('close')+'</button><button class="btn primary" onclick="closeModal();runAutomationJob(\''+j.id+'\')">'+dual('创建执行任务','Create Run')+'</button></div>')}

><small>os:linux + env:prod</small></div><div class="source-choice '+(scanDraft.source==='ip'?'selected':'')+'" onclick="chooseScanSourceV5(\'ip\',254)"><b>'+dual('IP 范围','IP Range')+'</b><small>10.28.16.0/24</small></div><div class="source-choice '+(scanDraft.source==='manual'?'selected':'')+'" onclick="chooseScanSourceV5(\'manual\',12)"><b>'+dual('手工清单','Manual List')+'</b><small>'+dual('主机名 / IP，一行一个','Hostname / IP, one per line')+'</small></div></div><div class="form-grid" style="margin-top:13px"><div class="field"><label>'+t('env')+'</label><select id="scanEnv"><option value="prod">'+t('prod')+'</option><option value="test">'+t('test')+'</option></select></div><div class="field"><label>'+dual('目标数量','Target Count')+'</label><input id="assetCount" value="'+scanDraft.assetCount+'"></div><div class="field full"><label>'+dual('范围表达式','Scope Expression')+'</label><input id="scanScope" value="'+(scanDraft.source==='service'?'service:payment AND env:prod':scanDraft.source==='tag'?'tag:os=linux AND env=prod':scanDraft.source==='ip'?'10.28.16.0/24':'PRD-APP-021, PRD-APP-022')+'"></div></div><div class="scope-preview"><div class="scope-preview-head"><span>'+dual('目标预览','Target Preview')+'</span><span>'+scanDraft.assetCount+' '+dual('个匹配目标','matched targets')+'</span></div>'+allAssets().slice(0,3).map(function(a){return '<div class="scope-asset"><b>'+a.name+'</b><span>'+a.app+'</span><span>'+t(a.env)+'</span><span>'+a.os+'</span></div>'}).join('')+'</div>';if(step===3)body='<div class="wizard-intro"><h4>'+dual('凭证、并发与调度','Credential, concurrency and schedule')+'</h4><p>'+dual('有凭证检查用于确认软件版本和补丁状态；生产任务默认使用安全插件集。','Authenticated checks confirm software versions and patch state. Production uses safe checks by default.')+'</p></div><div class="form-grid"><div class="field"><label>'+t('credential')+'</label><select id="credentialMode"><option value="agent">Gazellio Agent</option><option value="vault">Vault · Linux/Windows Prod</option><option value="network">Network only</option></select></div><div class="field"><label>'+dual('执行计划','Schedule')+'</label><select id="scanSchedule"><option value="now">'+dual('立即执行','Run now')+'</option><option value="daily">'+dual('每天 02:00','Daily at 02:00')+'</option><option value="weekly">'+dual('每周日 02:00','Sunday at 02:00')+'</option></select></div><div class="field"><label>'+dual('并发资产数','Target Concurrency')+'</label><select><option>20</option><option>40</option><option>80</option></select></div><div class="field"><label>'+dual('扫描强度','Intensity')+'</label><select id="scanIntensity"><option value="safe">Safe</option><option value="balanced" selected>Balanced</option><option value="deep">Deep</option></select></div></div><div class="form-section"><div class="form-section-title"><span>'+dual('执行前校验','Pre-flight Validation')+'</span><span class="tag ok">'+dual('将自动执行','Automatic')+'</span></div><label class="check-row"><input type="checkbox" checked>'+dual('验证 Agent、凭证和扫描节点可用性','Validate agent, credentials and scanner capacity')+'</label><label class="check-row"><input type="checkbox" checked>'+dual('自动排除维护中、离线或已隔离资产','Exclude assets in maintenance, offline or isolated')+'</label><label class="check-row"><input type="checkbox" checked>'+dual('业务健康探针异常时暂停该业务系统','Pause a service group if health probes fail')+'</label></div>';if(step===4)body='<div class="wizard-intro"><h4>'+dual('确认执行参数','Review execution parameters')+'</h4><p>'+dual('创建后先执行目标解析和凭证预检，通过后进入扫描队列。','Target resolution and credential pre-check run before the task enters the scan queue.')+'</p></div><div class="review-grid"><div class="review-item"><span>'+dual('任务','Task')+'</span><b>'+esc(scanDraft.name)+'</b></div><div class="review-item"><span>'+dual('扫描类型','Scan Type')+'</span><b>'+scanDraft.template+'</b></div><div class="review-item"><span>'+dual('目标','Targets')+'</span><b>'+scanDraft.assetCount+' · '+scanDraft.environment+'</b></div><div class="review-item"><span>'+dual('凭证 / 调度','Credential / Schedule')+'</span><b>'+scanDraft.credential+' · '+scanDraft.schedule+'</b></div></div><div class="validation-grid" style="margin-top:14px"><div class="validation-card"><span>'+dual('Agent 可达','Agent Reachable')+'</span><b>181 / 186</b><p>'+dual('5 台离线资产将自动排除','5 offline targets will be excluded')+'</p></div><div class="validation-card"><span>'+dual('凭证验证','Credential Check')+'</span><b>98.9%</b><p>'+dual('2 台需要使用 Vault 回退凭证','2 targets use Vault fallback')+'</p></div><div class="validation-card"><span>'+dual('预计时长','Estimated Duration')+'</span><b>16–22 min</b><p>scanner-sh-01 · 20 concurrency</p></div></div>';showModal('<div class="modal-head"><div><h3>'+t('newScanTitle')+'</h3><div class="card-meta">'+dual('扫描任务配置','Scan task configuration')+'</div></div><button class="close-x" onclick="closeModal()">×</button></div>'+wizardHeader(step,labels)+'<div class="modal-body">'+body+'</div><div class="modal-foot"><button class="btn" onclick="closeModal()">'+t('cancel')+'</button><span class="spacer"></span>'+(step>1?'<button class="btn" onclick="scanWizardBack('+step+')">'+dual('上一步','Back')+'</button>':'')+'<button class="btn primary" onclick="'+(step<4?'scanWizardNext('+step+')':'launchScan()')+'">'+(step<4?dual('下一步','Next'):dual('创建并执行','Create & Run'))+'</button></div>')}
launchScan=function(){collectScanStep(3);const id='SCAN-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+String(Math.floor(Math.random()*900)+100);const task={id:id,name:scanDraft.name,nameEn:scanDraft.name,scope:scanDraft.scope,template:scanDraft.template,status:scanDraft.schedule==='now'?'running':'queued',progress:scanDraft.schedule==='now'?1:0,assets:scanDraft.assetCount,scanned:0,findings:0,created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),mode:/Web/i.test(scanDraft.template)?'web':scanDraft.credential,schedule:scanDraft.schedule,owner:scanDraft.owner,nextRun:scanDraft.schedule==='now'?'—':dual('按计划执行','Scheduled'),critical:0,high:0,medium:0};appState.scans.unshift(task);audit(dual('创建扫描任务','Scan task created'),id+' · '+task.assets+' targets');saveAppState();closeModal();scanWorkspace='tasks';go('scan');if(task.status==='running')startScanRuntime(id);showToast(task.status==='running'?dual('目标与凭证预检通过，扫描已启动','Pre-flight passed; scan started'):dual('扫描任务已进入调度队列','Scan task scheduled'))}
startScanRuntime=function(id){if(runtime.scans[id])return;runtime.scans[id]=setInterval(function(){const s=appState.scans.find(function(x){return x.id===id});if(!s||s.status!=='running'){clearInterval(runtime.scans[id]);delete runtime.scans[id];return}s.progress=Math.min(100,s.progress+Math.floor(Math.random()*7)+3);s.scanned=Math.min(s.assets,Math.round(s.assets*s.progress/100));s.findings=Math.max(s.findings,Math.round(s.progress/11));s.critical=Math.min(2,Math.floor(s.findings/7));s.high=Math.min(8,Math.floor(s.findings/3));s.medium=Math.max(0,s.findings-s.critical-s.high);if(s.progress>=100){s.status='completed';s.scanned=s.assets;s.completed=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});audit(dual('扫描完成','Scan completed'),s.id+' · '+s.findings+' findings');clearInterval(runtime.scans[id]);delete runtime.scans[id];showToast(dual(s.id+' 扫描完成，漏洞实例已更新',s.id+' completed; vulnerability instances updated'))}saveAppState();if(currentPage==='scan')render()},900)}
showScanResult=function(id){const s=appState.scans.find(function(x){return x.id===id});if(!s)return;const resultCount=Math.max(1,Math.min(vulnerabilities.length,s.findings||1));showModal('<div class="modal-head"><div><h3>'+s.id+' · '+(lang==='zh'?s.name:s.nameEn)+'</h3><div class="card-meta">'+s.template+' · '+s.scope+'</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="live-banner"><div class="live-orb">'+icon('scan')+'</div><div class="live-copy"><b>'+(s.status==='running'?'<span class="live-pulse"></span>'+dual('正在扫描资产','Scanning targets'):dual('扫描结果已归档','Scan results archived'))+'</b><span>'+s.scanned+'/'+s.assets+' '+dual('已完成','completed')+' · '+s.owner+'</span></div><div class="live-progress"><div class="progress"><span style="width:'+s.progress+'%"></span></div><small>'+s.progress+'%</small></div></div><div class="summary-strip"><div class="summary-cell"><div class="n">'+s.assets+'</div><div class="l">'+dual('有效目标','Valid targets')+'</div></div><div class="summary-cell"><div class="n">'+s.scanned+'</div><div class="l">'+dual('已完成','Completed')+'</div></div><div class="summary-cell"><div class="n">'+s.critical+'</div><div class="l">'+dual('超危','Critical')+'</div></div><div class="summary-cell"><div class="n">'+s.high+'</div><div class="l">'+dual('高危','High')+'</div></div><div class="summary-cell"><div class="n">98.9%</div><div class="l">'+dual('凭证成功率','Credential success')+'</div></div></div><div class="detail-tabs"><button class="active">'+dual('漏洞结果','Findings')+'</button><button>'+dual('失败目标','Failed Targets')+'</button><button>'+dual('扫描日志','Scan Log')+'</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>CVE</th><th>'+t('severity')+'</th><th>'+t('asset')+'</th><th>'+t('app')+'</th><th>'+dual('证据','Evidence')+'</th><th>'+t('patchAvail')+'</th><th>'+t('status')+'</th></tr></thead><tbody>'+vulnerabilities.concat(vulnerabilities).slice(0,resultCount+3).map(function(v,i){return '<tr><td class="link" onclick="closeModal();go(\'vuln\')">'+v.cve+'</td><td>'+severityTag(v.sev)+'</td><td class="mono">'+(i<allAssets().length?allAssets()[i].name:v.asset)+'</td><td>'+v.app+'</td><td>'+dual('组件版本命中','Component version matched')+'</td><td class="link" onclick="closeModal();patchView=\'catalog\';go(\'patch\')">'+v.patch+'</td><td><span class="tag '+(i%3===0?'warn':'purple')+'">'+(i%3===0?dual('新发现','New'):dual('已存在','Existing'))+'</span></td></tr>'}).join('')+'</tbody></table></div><div class="callout" style="margin-top:14px">'+dual('扫描结果按“资产 + CVE + 端口/组件”去重。新发现进入漏洞中心，已存在项仅更新证据和最后发现时间。','Results are deduplicated by asset + CVE + port/component. New findings enter the vulnerability center; existing findings update evidence and last-seen time.')+'</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">'+t('close')+'</button>'+(s.status==='running'?'<button class="btn danger" onclick="closeModal();stopScan(\''+s.id+'\')">'+dual('停止任务','Stop Task')+'</button>':'<button class="btn" onclick="closeModal();rerunScan(\''+s.id+'\')">'+dual('按原配置重跑','Rerun')+'</button>')+'<button class="btn primary" onclick="closeModal();go(\'vuln\')">'+dual('查看漏洞实例','Open Findings')+'</button></div>')}
function stopScan(id){const s=appState.scans.find(function(x){return x.id===id});if(!s)return;s.status='stopped';if(runtime.scans[id]){clearInterval(runtime.scans[id]);delete runtime.scans[id]}audit(dual('停止扫描任务','Scan stopped'),id);saveAppState();render();showToast(dual('扫描已停止，当前结果已保留','Scan stopped; partial results retained'))}
function rerunScan(id){const old=appState.scans.find(function(x){return x.id===id});if(!old)return;const nid='SCAN-'+String(Date.now()).slice(-6),s=Object.assign({},old,{id:nid,status:'running',progress:1,scanned:0,findings:0,critical:0,high:0,medium:0,created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});appState.scans.unshift(s);audit(dual('重新执行扫描','Scan rerun'),nid);saveAppState();render();startScanRuntime(nid);showToast(dual('已按原配置创建新扫描','New scan created from the original configuration'))}

function patchStageLabel(s){return {synced:dual('待适配分析','Qualification Pending'),qualified:dual('适配完成','Qualified'),testing:dual('测试中','Testing'),test_failed:dual('测试失败','Test Failed'),ready:dual('可生产发布','Ready for Production'),released:dual('发布中 / 已发布','Released'),superseded:dual('已被替代','Superseded')}[s]||s}
function patchStageTag(s){return '<span class="tag '+(s==='released'?'ok':s==='ready'?'purple':s==='test_failed'?'red':s==='testing'?'blue':s==='qualified'?'warn':'gray')+'">'+patchStageLabel(s)+'</span>'}
function patchPrimaryButton(p,close){const prefix=close?'closeModal();':'';if(p.stage==='synced')return '<button class="btn primary" onclick="'+prefix+'qualifyPatch(\''+p.id+'\')">'+dual('执行适配分析','Run Qualification')+'</button>';if(p.stage==='qualified'||p.stage==='test_failed')return '<button class="btn primary" onclick="'+prefix+'createPatchTestRun(\''+p.id+'\')">'+dual(p.stage==='test_failed'?'重新测试':'创建测试任务',p.stage==='test_failed'?'Retest':'Create Test Run')+'</button>';if(p.stage==='testing')return '<button class="btn primary" onclick="'+prefix+'patchView=\'batches\';go(\'patch\')">'+dual('查看测试批次','Open Test Batch')+'</button>';if(p.stage==='ready')return '<button class="btn primary" onclick="'+prefix+'patchModal(\''+p.id+'\')">'+dual('创建生产发布','Create Production Release')+'</button>';return '<button class="btn primary" onclick="'+prefix+'automationView=\'records\';go(\'automation\')">'+dual('查看安装记录','Open Install Records')+'</button>'}
function filterPatchRows(q){document.querySelectorAll('[data-patch-search]').forEach(function(r){const sev=document.getElementById('patchSeverityFilter')?.value||'all',stage=document.getElementById('patchStageFilter')?.value||'all';r.style.display=(r.dataset.patchSearch.indexOf((q||'').toLowerCase())>-1&&(sev==='all'||r.dataset.severity===sev)&&(stage==='all'||r.dataset.stage===stage))?'':'none'})}
function patchCatalogHtml(){return '<div class="catalog-toolbar"><div class="search">'+icon('scan')+'<input id="patchSearchInput" placeholder="'+dual('搜索补丁编号、CVE 或厂商','Search patch, CVE or vendor')+'" oninput="filterPatchRows(this.value)"></div><select class="select" id="patchSeverityFilter" onchange="filterPatchRows(document.getElementById(\'patchSearchInput\').value)"><option value="all">'+dual('全部等级','All severity')+'</option><option value="critical">'+dual('超危','Critical')+'</option><option value="high">'+dual('高危','High')+'</option><option value="medium">'+dual('中危','Medium')+'</option></select><select class="select" id="patchStageFilter" onchange="filterPatchRows(document.getElementById(\'patchSearchInput\').value)"><option value="all">'+dual('全部状态','All states')+'</option><option value="synced">'+dual('待适配分析','Qualification pending')+'</option><option value="qualified">'+dual('适配完成','Qualified')+'</option><option value="testing">'+dual('测试中','Testing')+'</option><option value="ready">'+dual('可生产发布','Ready')+'</option><option value="released">'+dual('已发布','Released')+'</option></select><div class="spacer"></div><span class="card-meta">'+patches.length+' '+dual('个补丁包','packages')+'</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>'+t('patchId')+'</th><th>'+t('severity')+'</th><th>CVE</th><th>'+dual('发布时间','Published')+'</th><th>'+t('affects')+'</th><th>'+dual('验证状态','Validation')+'</th><th>'+dual('修复截止','Due')+'</th><th>'+t('action')+'</th></tr></thead><tbody>'+patches.map(function(p){return '<tr data-patch-search="'+esc((p.id+p.vendor+p.cves).toLowerCase())+'" data-severity="'+p.severity+'" data-stage="'+p.stage+'"><td><div class="patch-title"><span class="patch-vendor">'+p.vendor.slice(0,2).toUpperCase()+'</span><div><b class="link" onclick="showPatchDetail(\''+p.id+'\')">'+p.id+'</b><small>'+p.vendor+' · '+p.size+'</small></div></div></td><td><span class="tag '+p.severity+'">'+severityName(p.severity)+'</span></td><td class="mono">'+p.cves+'</td><td>'+p.published+'</td><td><b>'+p.assets+'</b><small class="muted"> · '+p.installed+' '+dual('已安装','installed')+'</small></td><td class="patch-state">'+patchStageTag(p.stage)+'<small>'+p.signature+'</small></td><td>'+p.deadline+'<small class="muted"> · '+p.owner+'</small></td><td><div class="table-actions"><button class="action-link" onclick="showPatchDetail(\''+p.id+'\')">'+t('detail')+'</button>'+patchPrimaryButton(p,false).replace('class="btn primary"','class="action-link"')+'</div></td></tr>'}).join('')+'</tbody></table></div>'}
function patchValidationHtml(){const list=patches.filter(function(p){return ['qualified','testing','test_failed','ready'].includes(p.stage)});return '<div class="card table-wrap"><table class="table"><thead><tr><th>'+t('patchId')+'</th><th>'+dual('测试范围','Test Scope')+'</th><th>'+dual('安装结果','Install Result')+'</th><th>'+dual('应用探针','App Probes')+'</th><th>'+dual('漏洞复测','Rescan')+'</th><th>'+dual('负责人','Owner')+'</th><th>'+t('action')+'</th></tr></thead><tbody>'+list.map(function(p,i){const failed=p.stage==='test_failed';return '<tr><td class="link" onclick="showPatchDetail(\''+p.id+'\')">'+p.id+'<div class="muted" style="font-size:10px">'+p.cves+'</div></td><td>'+(Math.min(12,p.assets))+' '+dual('台测试资产','test assets')+'</td><td><span class="tag '+(failed?'red':p.stage==='qualified'?'gray':'ok')+'">'+(failed?dual('2 台失败','2 failed'):p.stage==='qualified'?dual('尚未执行','Not started'):dual('全部成功','All successful'))+'</span></td><td><span class="tag '+(failed?'red':p.stage==='ready'?'ok':'warn')+'">'+(failed?dual('异常','Failed'):p.stage==='ready'?dual('通过','Passed'):dual('等待','Pending'))+'</span></td><td><span class="tag '+(p.stage==='ready'?'ok':'gray')+'">'+(p.stage==='ready'?dual('通过','Passed'):dual('等待','Pending'))+'</span></td><td>'+p.owner+'</td><td>'+patchPrimaryButton(p,false)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function patchHistoryHtml(){return '<div class="card table-wrap"><table class="table"><thead><tr><th>'+dual('执行记录','Run')+'</th><th>'+t('patchId')+'</th><th>'+t('env')+'</th><th>'+dual('目标','Targets')+'</th><th>'+dual('结果','Result')+'</th><th>'+dual('开始时间','Started')+'</th><th>'+dual('耗时','Duration')+'</th><th>'+t('action')+'</th></tr></thead><tbody>'+appState.autoRecords.map(function(r){return '<tr><td class="link" onclick="showAutomationRecord(\''+r.id+'\')">'+r.id+'</td><td>'+r.patch+'</td><td>'+t(r.env)+'</td><td>'+r.targets+'</td><td>'+automationStatusTag(r.status)+'<div class="muted" style="font-size:10px;margin-top:4px">'+r.success+'/'+r.targets+' '+dual('成功','successful')+'</div></td><td>'+r.started+'</td><td>'+r.duration+'</td><td><button class="action-link" onclick="showAutomationRecord(\''+r.id+'\')">'+t('detail')+'</button></td></tr>'}).join('')+'</tbody></table></div>'}
patchPage=function(){const body=patchView==='catalog'?patchCatalogHtml():patchView==='validation'?patchValidationHtml():patchView==='history'?patchHistoryHtml():patchJobsHtml();return pageHeader('patch','patchSub','<button class="btn" onclick="syncPatchCatalog()">'+t('syncPatch')+'</button><button class="btn primary" onclick="patchModal()">'+t('createPatch')+'</button>')+'<div class="summary-strip"><div class="summary-cell"><div class="n">'+patches.length+'</div><div class="l">'+dual('补丁包','Patch packages')+'</div></div><div class="summary-cell"><div class="n">'+patches.filter(function(x){return x.stage==='synced'}).length+'</div><div class="l">'+dual('待适配分析','Qualification pending')+'</div></div><div class="summary-cell"><div class="n">'+patches.filter(function(x){return x.stage==='testing'||x.stage==='test_failed'}).length+'</div><div class="l">'+dual('测试处理中','In validation')+'</div></div><div class="summary-cell"><div class="n">'+patches.filter(function(x){return x.stage==='ready'}).length+'</div><div class="l">'+dual('可生产发布','Ready for production')+'</div></div><div class="summary-cell"><div class="n">'+patches.reduce(function(n,x){return n+x.assets},0).toLocaleString()+'</div><div class="l">'+dual('影响资产实例','Affected asset instances')+'</div></div></div><div class="product-tabs"><button class="'+(patchView==='catalog'?'active':'')+'" onclick="setPatchView(\'catalog\')">'+dual('补丁库','Patch Catalog')+' <span class="count">'+patches.length+'</span></button><button class="'+(patchView==='validation'?'active':'')+'" onclick="setPatchView(\'validation\')">'+dual('测试与验证','Test & Validation')+' <span class="count">'+patches.filter(function(x){return ['qualified','testing','test_failed','ready'].includes(x.stage)}).length+'</span></button><button class="'+(patchView==='batches'?'active':'')+'" onclick="setPatchView(\'batches\')">'+dual('发布批次','Release Batches')+' <span class="count">'+appState.patchJobs.length+'</span></button><button class="'+(patchView==='history'?'active':'')+'" onclick="setPatchView(\'history\')">'+dual('安装记录','Install History')+' <span class="count">'+appState.autoRecords.length+'</span></button></div>'+body}
function showPatchDetail(id){const p=patches.find(function(x){return x.id===id});if(!p)return;const start=patches.indexOf(p)%Math.max(1,allAssets().length);const impacted=[];for(let i=0;i<5;i++)impacted.push(allAssets()[(start+i)%allAssets().length]);showModal('<div class="modal-head"><div class="patch-detail-head"><div class="patch-detail-title"><div style="display:flex;gap:7px;margin-bottom:8px"><span class="tag '+p.severity+'">'+severityName(p.severity)+'</span>'+patchStageTag(p.stage)+'</div><h3>'+p.id+'</h3><p>'+p.vendor+' · '+p.cves+' · '+p.size+'</p></div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="review-grid"><div class="review-item"><span>'+dual('补丁来源','Source')+'</span><b>'+p.source+'</b></div><div class="review-item"><span>'+dual('签名验证','Signature')+'</span><b style="color:#22815A">'+p.signature+'</b></div><div class="review-item"><span>'+dual('影响资产','Affected Assets')+'</span><b>'+p.assets+' · '+p.installed+' '+dual('已安装','installed')+'</b></div><div class="review-item"><span>'+dual('重启要求','Restart')+'</span><b>'+p.reboot+'</b></div></div><div class="detail-tabs"><button class="active">'+dual('影响资产','Affected Assets')+'</button><button>'+dual('测试证据','Validation Evidence')+'</button><button>'+dual('安装历史','Install History')+'</button><button>'+dual('包信息','Package Info')+'</button></div><div class="asset-mini-table"><div class="asset-mini-row header"><span>'+dual('资产','Asset')+'</span><span>'+dual('业务系统','Service')+'</span><span>'+t('env')+'</span><span>'+t('owner')+'</span><span>'+dual('当前版本','Current Version')+'</span></div>'+impacted.map(function(a,i){return '<div class="asset-mini-row"><b>'+a.name+'</b><span>'+a.app+'</span><span>'+t(a.env)+'</span><span>'+a.owner+'</span><span>'+(i%2?dual('需要更新','Update required'):dual('已安装','Installed'))+'</span></div>'}).join('')+'</div><div class="validation-grid" style="margin-top:12px"><div class="validation-card"><span>'+dual('适用性分析','Applicability')+'</span><b>'+(p.stage==='synced'?dual('尚未执行','Not started'):dual('已完成','Completed'))+'</b><p>'+dual('操作系统、组件版本、依赖和冲突检查','OS, component version, dependency and conflict checks')+'</p></div><div class="validation-card"><span>'+dual('测试安装','Test Installation')+'</span><b>'+(p.stage==='test_failed'?dual('失败','Failed'):['testing','ready','released'].includes(p.stage)?dual('已执行','Executed'):dual('等待','Pending'))+'</b><p>'+dual('安装结果、重启和回滚点证据','Install result, restart and rollback evidence')+'</p></div><div class="validation-card"><span>'+dual('生产合规','Production Compliance')+'</span><b>'+Math.round((p.installed/p.assets)*100)+'%</b><p>'+p.installed+'/'+p.assets+' '+dual('资产已达到补丁基线','assets meet the patch baseline')+'</p></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">'+t('close')+'</button>'+patchPrimaryButton(p,true)+'</div>')}
function qualifyPatch(id){const p=patches.find(function(x){return x.id===id});if(!p)return;p.stage='qualified';p.test='pending';audit(dual('完成补丁适配分析','Patch qualification completed'),id);saveAppState();patchView='validation';render();showToast(dual('适用性分析完成，已进入测试队列','Qualification complete; patch added to test queue'))}
function createPatchTestRun(id){const p=patches.find(function(x){return x.id===id});if(!p)return;p.stage='testing';p.test='pending';const jid='PCH-'+String(Date.now()).slice(-6);appState.patchJobs.unshift({id:jid,patch:id,env:'test',ring:'Test Group · '+Math.min(12,p.assets),status:'running',progress:3,stage:dual('执行前检查','Pre-check'),created:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});audit(dual('创建补丁测试任务','Patch test run created'),jid+' · '+id);saveAppState();patchView='batches';render();startPatchRuntime(jid);showToast(dual('测试任务已创建并开始执行','Test run created and started'))}

function taskRowsHtml(){const list=appState.tasks.filter(function(x){return taskFilter==='all'||x.stage===taskFilter});return '<div class="worklist">'+list.map(function(x){const urgent=x.priority==='P1'&&x.stage!=='closed';return '<div class="worklist-row"><div class="priority-box '+x.priority.toLowerCase()+'">'+x.priority+'</div><div class="work-main"><b class="link" onclick="showTask(\''+x.id+'\')">'+x.cve+' · '+x.patch+'</b><small>'+x.id+' · '+x.asset+' · '+x.service+'</small></div><div class="work-cell">'+x.owner+'<small>'+x.affected+' '+dual('台影响资产','affected assets')+'</small></div><div class="work-cell">'+taskStatusTag(x.stage)+'<small>'+x.sourceScan+'</small></div><div class="work-cell"><span class="sla-clock '+(urgent?'urgent':'')+'">'+x.deadline.slice(5)+'</span><small>'+dual('修复截止','remediation due')+'</small></div><div class="work-cell">'+t(x.environment)+'<small>'+x.asset+'</small></div><div class="work-cell"><button class="action-link" onclick="showTask(\''+x.id+'\')">'+(x.stage==='closed'?t('detail'):dual('处理','Work'))+'</button></div></div>'}).join('')+'</div>'}
taskPage=function(){const active=appState.tasks.filter(function(x){return x.stage!=='closed'});return pageHeader('task','taskSub','<button class="btn" onclick="bulkAssignTasks()">'+dual('批量分派','Bulk Assign')+'</button><button class="btn primary" onclick="createTaskModal()">'+t('createTask')+'</button>')+'<div class="summary-strip"><div class="summary-cell"><div class="n">'+active.length+'</div><div class="l">'+dual('处理中','Active work orders')+'</div></div><div class="summary-cell"><div class="n">'+active.filter(function(x){return x.priority==='P1'}).length+'</div><div class="l">'+dual('P1 紧急','P1 urgent')+'</div></div><div class="summary-cell"><div class="n">'+active.filter(function(x){return ['test_patch','test_validate'].includes(x.stage)}).length+'</div><div class="l">'+dual('测试处理中','In test')+'</div></div><div class="summary-cell"><div class="n">'+active.filter(function(x){return ['prod_ready','executing'].includes(x.stage)}).length+'</div><div class="l">'+dual('生产阶段','Production')+'</div></div><div class="summary-cell"><div class="n">94.2%</div><div class="l">'+dual('SLA 达标率','SLA attainment')+'</div></div></div><div class="catalog-toolbar"><div class="search">'+icon('scan')+'<input placeholder="'+dual('搜索任务、CVE、资产或责任人','Search task, CVE, asset or owner')+'" oninput="filterTaskRowsV5(this.value)"></div><select class="select" onchange="setTaskFilter(this.value)"><option value="all">'+dual('全部状态','All states')+'</option><option value="triage">'+dual('研判中','Triage')+'</option><option value="plan">'+dual('待制定方案','Planning')+'</option><option value="test_patch">'+dual('测试安装','Test install')+'</option><option value="test_validate">'+dual('测试验证','Test validation')+'</option><option value="prod_ready">'+dual('待生产发布','Production ready')+'</option><option value="executing">'+dual('生产执行中','Executing')+'</option><option value="rescan">'+dual('待复测','Rescan pending')+'</option><option value="closed">'+dual('已关闭','Closed')+'</option></select><div class="spacer"></div><span class="card-meta">'+dual('按优先级和修复截止时间排序','Sorted by priority and remediation due date')+'</span></div>'+taskRowsHtml()}
function filterTaskRowsV5(q){document.querySelectorAll('.worklist-row').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q.toLowerCase())>-1?'':'none'})}
function bulkAssignTasks(){appState.tasks.filter(function(x){return x.stage==='triage'&&!x.owner}).forEach(function(x){x.owner='安全运营'});audit(dual('执行批量分派','Bulk assignment completed'),appState.tasks.length+' tasks');saveAppState();showToast(dual('已依据业务系统责任关系完成分派','Tasks assigned from service ownership rules'))}
createTaskModal=function(vIndex){const v=Number.isInteger(vIndex)?vulnerabilities[vIndex]:vulnerabilities[0];showModal('<div class="modal-head"><div><h3>'+t('createTask')+'</h3><div class="card-meta">'+dual('从已确认的漏洞实例创建处置工单','Create a work order from a confirmed vulnerability instance')+'</div></div><button class="close-x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="callout">'+dual('系统会自动合并同一漏洞、同一业务系统且修复窗口一致的资产，避免重复工单。','Assets with the same vulnerability, service and remediation window are grouped to avoid duplicate work orders.')+'</div><div class="form-grid" style="margin-top:14px"><div class="field full"><label>'+dual('漏洞实例','Vulnerability Instance')+'</label><select id="taskVuln">'+vulnerabilities.map(function(x,i){return '<option value="'+i+'" '+(x===v?'selected':'')+'>'+x.cve+' · '+x.app+' · '+x.asset+'</option>'}).join('')+'</select></div><div class="field"><label>'+t('owner')+'</label><select id="taskOwner"><option>'+v.owner+'</option><option>陈浩</option><option>刘洁</option><option>王锐</option><option>周宁</option></select></div><div class="field"><label>'+dual('修复优先级','Remediation Priority')+'</label><select id="taskPriority"><option>P1</option><option>P2</option><option>P3</option></select></div><div class="field"><label>'+dual('修复截止时间','Remediation Due')+'</label><input id="taskDeadline" type="datetime-local" value="2026-10-02T18:00"></div><div class="field"><label>'+dual('处置策略','Disposition')+'</label><select id="taskDisposition"><option value="patch">'+dual('补丁修复','Patch Remediation')+'</option><option value="mitigate">'+dual('临时缓解 + 后续修复','Mitigate then Patch')+'</option><option value="exception">'+dual('风险接受申请','Risk Acceptance Request')+'</option></select></div><div class="field full"><label>'+dual('研判说明','Triage Notes')+'</label><textarea id="taskNote">'+dual('确认受影响版本与实际暴露面，优先在测试环境验证补丁和回滚方案。','Confirm affected versions and exposure, then validate the patch and rollback in test.')+'</textarea></div></div><div class="scope-p runAutomationJob=function(id){const j=appState.autoJobs.find(function(x){return x.id===id}),rid='RUN-'+String(Date.now()).slice(-6);appState.autoRecords.unshift({id:rid,jobId:j.id,jobName:j.name,jobNameEn:j.nameEn,patch:'KB5072180',env:'test',targets:12,success:0,failed:0,status:'running',progress:1,stage:'Pre-check',started:new Date().toLocaleString(),duration:'0m',operator:dual('当前用户','Current User'),caseId:'REM-260929-031'});audit(dual('创建自动化执行','Automation run created'),rid);automationView='records';saveAppState();closeModal();render();startAutomationRuntime(rid);showToast(dual('自动化执行已启动，进度将实时更新','Automation started; progress updates live'))}
toggleAutomationRecord=function(id){const r=appState.autoRecords.find(function(x){return x.id===id});if(!r)return;r.status=r.status==='paused'?'running':'paused';r.stage=r.status==='paused'?'Paused by operator':automationStage(r.progress);if(r.status==='paused'&&runtime.autoRuns[id]){clearInterval(runtime.autoRuns[id]);delete runtime.autoRuns[id]}if(r.status==='running')startAutomationRuntime(id);audit(r.status==='paused'?dual('暂停自动化执行','Automation run paused'):dual('恢复自动化执行','Automation run resumed'),id);saveAppState();closeModal();render();showToast(r.status==='paused'?dual('执行已安全暂停','Run safely paused'):dual('执行已恢复','Run resumed'))}
retryAutomationRecord=function(id){const r=appState.autoRecords.find(function(x){return x.id===id});if(!r)return;r.status='running';r.stage='Retrying failed node';r.failed=0;r.progress=Math.max(10,r.progress-3);audit(dual('重试自动化节点','Automation node retried'),id);saveAppState();closeModal();render();startAutomationRuntime(id);showToast(dual('已从失败节点继续执行，进度实时更新','Resumed from failed node with live progress'))}
const resumeRuntimeV5=resumeRuntime;
resumeRuntime=function(){resumeRuntimeV5();appState.autoRecords.filter(function(x){return x.status==='running'}).forEach(function(x){startAutomationRuntime(x.id)})};
const taskPageWithFilterState=taskPage;
taskPage=function(){return taskPageWithFilterState().replace('value="'+taskFilter+'"','value="'+taskFilter+'" selected')};

function render(){
 navRender(); document.getElementById('topTitle').textContent=t(currentPage); document.getElementById('langChip').textContent=lang==='zh'?'中 / EN':'EN / 中';
 const globalInput=document.getElementById('globalSearch'); if(globalInput)globalInput.placeholder=lang==='zh'?'搜索漏洞、资产或任务':'Search vulnerabilities, assets or tasks';
 const c=document.getElementById('content'); const pages={overview:overviewV2,vuln:vulnPage,scan:scanPage,patch:patchPage,task:taskPage,automation:automationPage,calendar:calendarPage,report:reportPage,settings:settingsPage}; if(!pages[currentPage])currentPage='overview'; c.innerHTML=`<div class="page active">${pages[currentPage]()}</div>`; c.scrollTop=0;
}
function go(p){currentPage=p;render()}
function setLang(l){lang=l;localStorage.setItem('gazellioLang',l);document.documentElement.lang=l==='zh'?'zh-CN':'en';render();showToast(l==='zh'?'已切换为中文':'Switched to English')}
render();
resumeRuntime();
</script>
