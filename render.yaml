services:
  # Keep the existing service name so a Blueprint sync upgrades the current
  # backend in place instead of creating a second database-connected API.
  - type: web
    name: gazellio
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: gazellio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gazellio-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gazellio-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gazellio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gazellio-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: AGENT_REGISTRATION_TOKEN
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DB_POOL_SIZE
        value: "6"
      # The static site uses bearer-token authentication, not cookies. This
      # Render-only pattern avoids a circular Blueprint dependency while still
      # restricting browser origins to Render-hosted sites.
      - key: CORS_ORIGINS
        value: https://*.onrender.com

  # The React application is now an independent CDN-backed static site.
  # A frontend-only commit no longer rebuilds the Java service.
  - type: web
    name: gazellio-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: gazellio
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: gazellio-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: gazellio
    user: gazellio
    ipAllowList: []
