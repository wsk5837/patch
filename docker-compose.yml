services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gazellio
      POSTGRES_USER: gazellio
      POSTGRES_PASSWORD: gazellio
    volumes:
      - gazellio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazellio -d gazellio"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gazellio
      DB_USER: gazellio
      DB_PASSWORD: gazellio
      JWT_SECRET: local-development-secret-change-me-123456789
      SEED_DEMO_DATA: "true"
      CMDB_ENABLED: ${CMDB_ENABLED:-false}
      CMDB_BASE_URL: ${CMDB_BASE_URL:-https://zypoc.gazellio.com/backend-server}
      CMDB_CLIENT_ID: ${CMDB_CLIENT_ID:-}
      CMDB_CLIENT_SECRET: ${CMDB_CLIENT_SECRET:-}
      CMDB_SYNC_ON_STARTUP: ${CMDB_SYNC_ON_STARTUP:-true}
      CMDB_REPLACE_LOCAL_ASSETS: ${CMDB_REPLACE_LOCAL_ASSETS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      PORT: 10000
      BACKEND_HOSTPORT: backend:8080
    depends_on:
      - backend
    ports:
      - "10000:10000"

volumes:
  gazellio_pg:
